<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        PocketSmart AI
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="/static/styles.css"
    >
</head>

<body>

<header class="navbar">

    <a
        class="brand"
        href="/"
    >
        PocketSmart AI
    </a>

    {% if user %}

    <nav>

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/home-planner">
            Home
        </a>

        <a href="/party-planner">
            Party
        </a>

        <a href="/jewelry-planner">
            Jewelry
        </a>

        <a href="/history">
            History
        </a>

        <a href="/logout">
            Logout
        </a>

    </nav>

    {% else %}

    <nav>

        <a href="/login">
            Login
        </a>

        <a
            class="nav-cta"
            href="/register"
        >
            Register
        </a>

    </nav>

    {% endif %}

</header>


<main class="container">

    {% block content %}
    {% endblock %}

</main>


<footer>

    © 2026 PocketSmart AI

    <br>

    AI-assisted planning.
    Always verify prices before purchasing.

</footer>


<script src="/static/app.js"></script>

</body>

</html>
