{% extends "base.html" %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="auth-card">

    <h1>
        Welcome Back
    </h1>


    {% if registered %}

    <div class="notice">

        Registration successful.
        Please log in.

    </div>

    {% endif %}


    <form
        method="post"
        action="/login"
        class="form"
    >

        <label>
            Username

            <input
                name="username"
                required
            >
        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                required
            >
        </label>


        <button
            class="btn"
            type="submit"
        >
            Login
        </button>

    </form>


    <p>

        New user?

        <a href="/register">
            Create an account
        </a>

    </p>

</div>

{% endblock %}
